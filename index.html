<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Cryptography & Steganography Exam Simulator</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f4f7f6; 
            padding-bottom: 80px; 
            color: #333; 
            -webkit-font-smoothing: antialiased;
        }
        h1, h2 { color: #2c3e50; text-align: center; padding: 0 10px; }
        .section-desc { text-align: center; color: #555; padding: 0 15px; margin-bottom: 20px; font-weight: 500;}
        
        .score-box {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 1.5em;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
        }

        .main_box {
            border: 1px solid #ddd;
            margin: 20px auto;
            max-width: 800px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            overflow: hidden;
            padding-bottom: 20px;
            width: 95%; 
        }

        .question {
            font-size: 1.15em;
            font-weight: 600;
            background-color: #34495e;
            color: white;
            padding: 15px 20px;
            line-height: 1.4;
        }

        .container { padding: 0 15px; margin-top: 15px; }
        
        .opt {
            margin: 10px 0;
            padding: 14px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            display: block; 
            background-color: #fff;
            -webkit-tap-highlight-color: transparent; 
            font-size: 1em;
            line-height: 1.4;
        }
        .opt:hover, .opt:active { background-color: #f8f9fa; border-color: #bdc3c7; }
        input[type="radio"] { margin-right: 12px; transform: scale(1.3); vertical-align: middle; cursor: pointer;}

        .explanation, .sb-answer {
            display: none;
            padding: 15px;
            margin: 20px 0 0 0;
            border-radius: 6px;
            border-left: 5px solid;
            font-size: 0.95em;
            line-height: 1.5;
        }
        .explanation.correct { background-color: #e8f5e9; border-left-color: #27ae60; }
        .explanation.correct h4 { color: #27ae60; margin-top: 0; margin-bottom: 8px; }
        .explanation.wrong { background-color: #f8d7da; border-left-color: #dc3545; }
        .explanation.wrong h4 { color: #721c24; margin-top: 0; margin-bottom: 8px; }

        .correct-answer { background-color: #d4edda !important; border-color: #28a745 !important; color: #155724; font-weight: 600;}
        .wrong-answer { background-color: #f8d7da !important; border-color: #dc3545 !important; color: #721c24; }

        .sb-answer { background-color: #e9ecef; border-left-color: #007bff; display: none; }
        .sb-answer h4 { color: #007bff; margin-top: 0; margin-bottom: 8px; }
